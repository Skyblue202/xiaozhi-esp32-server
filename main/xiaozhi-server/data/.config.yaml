server:
  ip: 0.0.0.0
  port: 8000
  http_port: 8003
  websocket: wss://xiaozhi-esp32-server-production-5f78fc40.up.railway.app/xiaozhi/v1/
  vision_explain: https://xiaozhi-esp32-server-production-5f78fc40.up.railway.app/mcp/vision/explain
  timezone_offset: -5

log:
  log_level: INFO
  log_dir: tmp
  log_file: "server.log"
  data_dir: data

delete_audio: true
close_connection_no_voice_time: 120

exit_commands:
  - "salir"
  - "adiós"
  - "apágate"

system_error_response: "Lo siento, tengo un problema en este momento. Intentemos de nuevo en un rato."

end_prompt:
  enable: true
  prompt: |
    Despídete del usuario en español con una frase corta y amable.

selected_module:
  VAD: SileroVAD
  ASR: GroqASR
  LLM: DeepSeekLLM
  TTS: EdgeTTS
  Memory: nomem
  Intent: function_call

Intent:
  function_call:
    type: function_call
    functions:
      - change_role
      - get_weather
      - get_news_from_newsnow
      - play_music

Memory:
  nomem:
    type: nomem

VAD:
  SileroVAD:
    type: silero
    threshold: 0.5
    threshold_low: 0.3
    model_dir: models/snakers4_silero-vad
    min_silence_duration_ms: 200

ASR:
  GroqASR:
    type: openai
    api_key: "__GROQ_API_KEY__"
    base_url: https://api.groq.com/openai/v1/audio/transcriptions
    model_name: whisper-large-v3-turbo
    language: es
    prompt: "Conversación en español de Colombia con un asistente de voz."
    output_dir: tmp/

LLM:
  DeepSeekLLM:
    type: openai
    model_name: "deepseek-chat"
    api_key: "__DEEPSEEK_API_KEY__"
    url: "https://api.deepseek.com"

TTS:
  EdgeTTS:
    type: edge
    voice: es-ES-ElviraNeural
    output_dir: tmp/

prompt: |
  IDIOMA OBLIGATORIO: ESPAÑOL.
  Responde SIEMPRE y ÚNICAMENTE en español, sin importar el idioma en que te hablen o el idioma de estas instrucciones.
  NUNCA uses chino, inglés ni ningún otro idioma. NUNCA escribas caracteres chinos.
  Si el texto del usuario parece estar en otro idioma o no tiene sentido, es un error del micrófono: pide en español que lo repita.
  Eres un asistente de voz amigable. Tus respuestas se leen en voz alta: sé breve (1 a 3 frases), natural, sin emojis, sin listas y sin símbolos.
